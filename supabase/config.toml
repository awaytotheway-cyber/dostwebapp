# DOST — Supabase config for Edge Functions
project_id = "dost-app"

[functions.chat]
enabled = true
verify_jwt = true

[functions.embed-modules]
enabled = true
verify_jwt = false

[functions.update-memory]
enabled = true
verify_jwt = true

[functions.export-data]
enabled = true
verify_jwt = true

[functions.delete-conversations]
enabled = true
verify_jwt = true

[functions.delete-account]
enabled = true
verify_jwt = true

[functions.extract-emotions]
enabled = true
verify_jwt = true

[functions.hearing-extract-emotions]
enabled = true
verify_jwt = true

[functions.generate-journey-insight]
enabled = true
verify_jwt = true

[functions.transcribe-voice-note]
enabled = true
verify_jwt = true

[functions.delete-message]
enabled = true
verify_jwt = true

# Invoked by pg_cron with no JWT — it authenticates by checking the
# service role key in the Authorization header itself. Leaving
# verify_jwt on here would break the nightly run.
[functions.nightly-consolidation]
enabled = true
verify_jwt = false
