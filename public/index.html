<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f9f6f0;
        color: #3d2c1e;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .dost-boot {
        margin: auto;
        text-align: center;
        padding: 24px;
      }
      .dost-boot h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 0.08em;
        font-weight: 500;
      }
      .dost-boot p {
        margin: 0;
        opacity: 0.72;
        line-height: 1.5;
      }
      .dost-boot .dot {
        width: 10px;
        height: 10px;
        margin: 18px auto 0;
        border-radius: 999px;
        background: #8b7355;
        animation: dost-pulse 1.8s ease-in-out infinite;
      }
      @keyframes dost-pulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="dost-boot" aria-live="polite">
        <h1>DOST</h1>
        <p>Starting gently…</p>
        <p>The first load can take a few minutes while the app prepares.</p>
        <div class="dot" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>
